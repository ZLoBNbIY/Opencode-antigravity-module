name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [V2]

concurrency:
  group: windows-release-v2
  queue: max

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8

jobs:
  version:
    if: github.ref == 'refs/heads/V2'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select release version
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(python3 packaging/windows/release_version.py)"
          refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag" \
            --jq ".[] | select(.ref == \"refs/tags/$tag\") | .ref")"
          if [[ -n "$refs" ]]; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq '.sha')"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $tag points to a different commit. Re-run all jobs to calculate a new version."
              exit 1
            fi
          fi
          published="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\" and .draft == false) | .id")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [[ -n "$published" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag already published."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    if: github.ref == 'refs/heads/V2'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r gui-manager/requirements-win-py312-x64.lock
          if ($LASTEXITCODE -ne 0) { throw 'Could not install runtime dependencies' }
      - name: Run unit tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_*.py"
          if ($LASTEXITCODE -ne 0) { throw 'Python tests failed' }
          node --test "tests/*.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript tests failed' }

  build:
    needs: [version, tests]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check the planned tag is still available
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          refs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")"
          if [[ -n "$refs" ]]; then
            target="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')"
            if [[ "$target" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG points to a different commit. Re-run all jobs to calculate a new version."
              exit 1
            fi
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Prepare build tools
        shell: pwsh
        run: |
          python -m pip install --require-hashes -r gui-manager/requirements-win-py312-x64.lock
          if ($LASTEXITCODE -ne 0) { throw 'Could not install runtime dependencies' }
          python -m pip install --only-binary=:all: pyinstaller==6.22.3
          if ($LASTEXITCODE -ne 0) { throw 'Could not install PyInstaller' }
          $inno = Join-Path $env:RUNNER_TEMP 'inno.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_5_4/innosetup-6.5.4.exe' -OutFile $inno
          if ((Get-FileHash -LiteralPath $inno).Hash -ne 'fa73bf47a4da250d185d07561c2bfda387e5e20db77e4570004cf6a133cc10b1') {
            throw 'Inno Setup hash mismatch'
          }
          $p = Start-Process $inno -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/NORESTART', ('/DIR="' + $dir + '"'))
          if ($p.ExitCode -ne 0) { throw 'Could not install build compiler' }
          $webview = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $webview
          "INNO_COMPILER=$(Join-Path $dir 'ISCC.exe')" >> $env:GITHUB_ENV
          "WEBVIEW_BOOTSTRAP=$webview" >> $env:GITHUB_ENV
      - name: Build and test packaged app
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          ./packaging/windows/build.ps1 -Version $version -InnoCompiler $env:INNO_COMPILER -WebViewBootstrap $env:WEBVIEW_BOOTSTRAP
      - name: Exercise install and uninstall on the build runner
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Installed AI HUB'
          $diagnostics = Join-Path $env:RUNNER_TEMP 'hub-install-diagnostics'
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $profile = Join-Path $env:RUNNER_TEMP 'hub-install-profile'
          $config = Join-Path $profile '.config\opencode'
          New-Item -ItemType Directory -Path $config -Force | Out-Null
          $existing = Join-Path $config 'opencode.jsonc'
          Set-Content -LiteralPath $existing -Value '{ /* preserve */ }'
          $hash = (Get-FileHash -LiteralPath $existing).Hash
          $setupLog = Join-Path $diagnostics 'setup.log'
          $previousProfile = $env:USERPROFILE
          try {
            $env:USERPROFILE = $profile
            $p = Start-Process './artifacts/windows/AntigravityHub-Setup-x64.exe' -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/NOICONS', '/TASKS=opencode', ('/DIR="' + $target + '"'), ('/LOG="' + $setupLog + '"'))
          } finally {
            $env:USERPROFILE = $previousProfile
          }
          if ($p.ExitCode -ne 0) { throw "Setup failed: $($p.ExitCode)" }
          if (-not (Test-Path -LiteralPath (Join-Path $config 'antigravity.json')) -or
              (Test-Path -LiteralPath (Join-Path $config 'opencode.json')) -or
              (Get-FileHash -LiteralPath $existing).Hash -ne $hash) {
            throw 'Optional OpenCode task did not preserve the existing JSONC or create the missing settings'
          }
          $exe = Join-Path $target 'AntigravityHub.exe'
          $report = Join-Path $diagnostics 'installed-hub-test.json'
          $app = Start-Process $exe -PassThru -ArgumentList @('--package-self-test', ('"' + $report + '"'))
          if (-not $app.WaitForExit(90000)) { $app.Kill(); throw 'Installed app self-test timed out' }
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($app.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $report)) { throw 'Installed app self-test failed' }
          $uninstallLog = Join-Path $diagnostics 'uninstall.log'
          $p = Start-Process (Join-Path $target 'unins000.exe') -Wait -PassThru -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', ('/LOG="' + $uninstallLog + '"'))
          if ($p.ExitCode -ne 0 -or (Test-Path -LiteralPath $exe)) { throw 'Uninstallation failed' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-install-diagnostics
          path: |
            ${{ runner.temp }}/hub-install-diagnostics/*.log
            ${{ runner.temp }}/hub-install-diagnostics/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AntigravityHub-Setup-x64
          path: artifacts/windows/
          if-no-files-found: error

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: AntigravityHub-Setup-x64
          path: release-assets
      - name: Tag the tested commit and publish the installer
        shell: bash
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum --strict --check AntigravityHub-Setup-x64.exe.sha256
          owner_repo="$GITHUB_REPOSITORY"
          created_tag=false
          created_draft_id=""
          published=false
          cleanup_on_failure() {
            if [[ "$published" == "true" ]]; then
              return
            fi
            if [[ -n "$created_draft_id" ]]; then
              gh api --method DELETE "repos/$owner_repo/releases/$created_draft_id" >/dev/null 2>&1 || true
            fi
            if [[ "$created_tag" == "true" ]]; then
              gh api --method DELETE "repos/$owner_repo/git/refs/tags/$TAG" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_on_failure EXIT

          matches="$(gh api --paginate "repos/$owner_repo/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")"
          if [[ -z "$matches" ]]; then
            gh api --method POST "repos/$owner_repo/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
            created_tag=true
          fi
          target="$(gh api "repos/$owner_repo/commits/$TAG" --jq '.sha')"
          if [[ "$target" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $TAG points to a different commit. Re-run all jobs to calculate a new version."
            exit 1
          fi

          releases_json="$(gh api --paginate "repos/$owner_repo/releases" \
            --jq ".[] | select(.tag_name == \"$TAG\") | {id, draft}" | jq -s '.')"
          if jq -e 'any(.[]; .draft == false)' <<<"$releases_json" >/dev/null; then
            published=true
            echo "Release $TAG already published."
            exit 0
          fi

          mapfile -t draft_ids < <(jq -r '.[] | select(.draft == true) | .id' <<<"$releases_json")
          if [[ ${#draft_ids[@]} -gt 1 ]]; then
            for stale_id in "${draft_ids[@]:1}"; do
              gh api --method DELETE "repos/$owner_repo/releases/$stale_id" >/dev/null
            done
            draft_ids=("${draft_ids[0]}")
          fi

          if [[ ${#draft_ids[@]} -eq 0 ]]; then
            gh release create "$TAG" --repo "$owner_repo" --verify-tag --draft \
              --title "AI HUB $TAG" --generate-notes \
              --notes "Windows x64 installer and SHA-256 checksum. The installer is unsigned."
            for _ in 1 2 3 4 5; do
              mapfile -t draft_ids < <(gh api --paginate "repos/$owner_repo/releases" \
                --jq ".[] | select(.tag_name == \"$TAG\" and .draft == true) | .id")
              if [[ ${#draft_ids[@]} -eq 1 ]]; then
                created_draft_id="${draft_ids[0]}"
                break
              fi
              sleep 2
            done
          fi

          if [[ ${#draft_ids[@]} -ne 1 ]]; then
            echo "::error::Expected a single draft release for $TAG, found ${#draft_ids[@]}."
            exit 1
          fi

          gh release upload "$TAG" AntigravityHub-Setup-x64.exe AntigravityHub-Setup-x64.exe.sha256 \
            --repo "$owner_repo" --clobber
          gh release edit "$TAG" --repo "$owner_repo" --draft=false
          published=true
